info:
  title: Wagtail API
  version: v2
openapi: 3.0.3
paths:
  /admin/api/main/documents/:
    get:
      operationId: documentsadmin_list
      parameters:
      - description: Comma-separated list of fields to include in the response. Prefix
          with ``*`` to start from all available fields, ``_`` to start from none,
          or ``-`` to remove a default field. See the API usage docs for the full
          syntax.
        in: query
        name: fields
        schema:
          type: string
      - description: Maximum number of results to return. Capped by the ``WAGTAILAPI_LIMIT_MAX``
          setting (default 20).
        in: query
        name: limit
        schema:
          type: integer
      - description: Number of results to skip before returning the page of results.
        in: query
        name: offset
        schema:
          type: integer
      - description: Field name to order by. Prefix with ``-`` for descending order,
          or use ``random`` for a random ordering.
        in: query
        name: order
        schema:
          type: string
      - description: Full-text search query. Disabled when ``WAGTAILAPI_SEARCH_ENABLED``
          is False.
        in: query
        name: search
        schema:
          type: string
      - description: Combine search terms with AND (default) or OR.
        in: query
        name: search_operator
        schema:
          enum:
          - and
          - or
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WagtailDocumentsadminList'
          description: ''
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      tags:
      - Documentsadmin
  /admin/api/main/documents/find/:
    get:
      operationId: documentsadmin_find
      parameters:
      - description: Look up an object by its primary key.
        in: query
        name: id
        schema:
          type: integer
      responses:
        '302':
          description: Redirects to the detail endpoint for the matched object.
        '404':
          description: No object matched the query.
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      tags:
      - Documentsadmin
  /admin/api/main/documents/{id}/:
    get:
      operationId: documentsadmin_retrieve
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WagtailDocumentsadminDetail'
          description: ''
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      tags:
      - Documentsadmin
  /admin/api/main/images/:
    get:
      operationId: imagesadmin_list
      parameters:
      - description: Comma-separated list of fields to include in the response. Prefix
          with ``*`` to start from all available fields, ``_`` to start from none,
          or ``-`` to remove a default field. See the API usage docs for the full
          syntax.
        in: query
        name: fields
        schema:
          type: string
      - description: Maximum number of results to return. Capped by the ``WAGTAILAPI_LIMIT_MAX``
          setting (default 20).
        in: query
        name: limit
        schema:
          type: integer
      - description: Number of results to skip before returning the page of results.
        in: query
        name: offset
        schema:
          type: integer
      - description: Field name to order by. Prefix with ``-`` for descending order,
          or use ``random`` for a random ordering.
        in: query
        name: order
        schema:
          type: string
      - description: Full-text search query. Disabled when ``WAGTAILAPI_SEARCH_ENABLED``
          is False.
        in: query
        name: search
        schema:
          type: string
      - description: Combine search terms with AND (default) or OR.
        in: query
        name: search_operator
        schema:
          enum:
          - and
          - or
          type: string
      responses:
